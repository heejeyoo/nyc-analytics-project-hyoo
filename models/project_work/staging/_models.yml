version: 2

models:
  - name: stg_311
    description: Cleaned, type-cast, curb-filtered 311 complaints
    columns:
      - name: complaint_id
        description: Primary key from NYC 311
        tests:
          - not_null
          - unique
      - name: created_at
        description: Timestamp when the complaint was filed
        tests:
          - not_null
      - name: borough
        description: Borough where the complaint was filed
        tests:
          - not_null
      - name: complaint_type
        description: Curb-related complaint category
        tests:
          - not_null

  - name: stg_ace
    description: Cleaned, type-cast MTA ACE violations
    columns:
      - name: violation_id
        description: Primary key from MTA ACE
        tests:
          - not_null
          - unique
      - name: first_occurrence
        description: Timestamp the violation was first detected
        tests:
          - not_null
      - name: bus_route_id
        description: Bus route the violation occurred on
        tests:
          - not_null
      - name: borough
        description: Borough where the violation occurred
        tests:
          - not_null
