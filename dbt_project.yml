name: nyc_analytics
version: 1.0.0
config-version: 2
profile: default

model-paths:
  - models
analysis-paths:
  - analyses
test-paths:
  - tests
seed-paths:
  - seeds
macro-paths:
  - macros
snapshot-paths:
  - snapshots

target-path: target
clean-targets:
  - target
  - dbt_packages

models:
  nyc_analytics:
    +materialized: table

    # ---------------- Existing assignment work (unchanged) ----------------
    assignment_work:
      staging:
        +materialized: table
        +schema: nyc_transit_restaurants_staging
      marts:
        +materialized: table
        +schema: nyc_transit_restaurants_marts
        shared:
          +materialized: table
        open_restaurant_apps:
          +materialized: table
        dot_311:
          +materialized: table

    # ---------------- Squeeze Index project (Milestone 4) ----------------
    project_work:
      staging:
        +materialized: view
        +schema: staging
      marts:
        +materialized: table
        # removed: +schema: marts_core (redundant; subfolders set it)
        shared:
          +schema: marts_core
        complaints_311:
          +schema: marts_core
        ace_violations:
          +schema: marts_core